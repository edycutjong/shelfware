name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Stage 1 · Lint + typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy . --ignore-missing-imports

  test:
    name: "Stage 1 · Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.11","3.12","3.13"]') || fromJSON('["3.11"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags: the deck test checks a tag on HEAD against the page's stamp
      - uses: actions/setup-python@v7
        with: { python-version: '${{ matrix.python-version }}' }
      - run: pip install -r requirements-dev.txt
      # Offline only. The live tests run in the live-api job below, where a CMC rate limit is
      # diagnosed as a rate limit rather than reported as a test failure. The engine
      # (shelfware/) is gated at 100% coverage; scripts/ are proof and rendering tooling whose
      # network legs (spike, snapshot, the live bench) are exercised by the live job instead.
      - run: >-
          pytest -q -m "not live" --cov=shelfware --cov=scripts --cov-report=term-missing
          --cov-report=xml --cov-fail-under=100
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with: { name: coverage, path: coverage.xml, retention-days: 7 }

  api:
    name: "Stage 1 · Proxy functions (node)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # api/*.js are dependency-free Vercel functions; the test stubs fetch and runs them
      # in-process, so there is nothing to install.
      - run: node --test tests/api.test.mjs

  audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install pip-audit && pip-audit -r requirements.txt

  readiness:
    name: "Stage 2 · No placeholders, no drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the deck's version stamp is `git describe --tags`; the drift gate needs the tags
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      # A TODO, a template token, a fake video link, a key-shaped string or a census older
      # than three days on any judge-facing file fails here, not in front of a judge.
      - run: python3 scripts/check_submission_readiness.py
      # The page and data/health.json are rendered from the committed census. If what is
      # committed is not what the renderer produces, a number was typed in by hand — fail.
      - run: python3 scripts/render_site.py --check
      # Every headline on README, DEMO, JUDGE and the page is recounted from data/census.json.
      - run: python3 scripts/verify.py

  bench:
    name: "Stage 3 · Deterministic benchmark"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      # The join alone, over the committed rows: no network, so this number is comparable
      # across runs. It is labelled a replay everywhere it appears and is NOT the product;
      # the live number comes from the job below.
      - run: python3 scripts/bench.py --replay --iterations 200

  live-api:
    name: "Stage 4 · The judged capability, for real"
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install -r requirements-dev.txt
      # No secret is configured for this job, deliberately: the state leg of the judged path
      # is keyless (/public-api/v1/cryptocurrency/map, 0 credits to any key), so this runs on
      # forks and PRs too. If CMC changes the contract, it breaks here rather than in front
      # of a judge.
      #
      # Exit 75 is EX_TEMPFAIL: CMC's anonymous tier throttled this runner. The keyless
      # surface is rate-limited per IP and GitHub's runners share theirs with everyone else
      # on the platform, so a red badge there would report someone else's traffic as our
      # breakage. The CLI answers from the labelled snapshot and exits 75 in that case; every
      # other non-zero exit still fails the job, which is the point of running this live.
      - name: Ask the ticker question with no credentials
        env:
          CMC_API_KEY: ""
          COINMARKETCAP_API_KEY: ""
          CMC_PRO_API_KEY: ""
        run: |
          set +e
          python3 -m shelfware MS
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning title=CMC throttled this runner::Anonymous tier rate-limited the shared runner IP (EX_TEMPFAIL). Not a product failure — re-run to confirm."
            exit 0
          fi
          exit "$code"
      - name: Live contract tests (skip, not fail, on a throttled IP)
        run: pytest -q -m live -rs

  # ── Stage 5: gate (main only) ─────────────────────────────────────────────────────────────
  # One job every later stage needs, so "all gates passed" is a single required check.
  deploy-gate:
    name: "Stage 5 · Deploy Gate"
    needs: [lint, test, api, audit, readiness, bench, live-api]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          echo "all CI/CD gates passed"
          echo "  Stage 1 — lint + typecheck · test matrix 3.11/3.12/3.13 (engine + scripts branch coverage >= 100%) · proxy functions"
          echo "  Stage 2 — pip-audit · no placeholders, no drift, every headline recounted"
          echo "  Stage 3 — deterministic replay bench"
          echo "  Stage 4 — the judged capability against the real CoinMarketCap API, keyless"

  # ── Stage 5b: release (main only, after the gate) ────────────────────────────────────────
  # release.yml: semver from the conventional commits since the last tag; when there is
  # something to release it stamps the version into the tree, re-renders site/, commits, tags
  # that commit and publishes the Release — so the deploy below ships the stamped commit.
  release:
    name: "Stage 5 · Release"
    needs: [deploy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'edycutjong/shelfware'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  # ── Stage 6: production deploy (main only, after every gate and the release) ─────────────
  # Prebuilt flow: `vercel build` runs here on the runner, `vercel deploy --prebuilt` uploads the
  # output — Vercel never builds from git for this project. The only secret is VERCEL_TOKEN; the
  # org/project ids are plain repository variables. Skipped on PRs and on forks. The custom domain
  # shelfware.edycu.dev and the shelfware-cmc.vercel.app name both follow --prod on their own.
  # The commit deployed is the release commit when one was just minted, else the pushed one.
  deploy:
    name: "Stage 6 · Production Deploy"
    needs: [deploy-gate, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'edycutjong/shelfware'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://shelfware.edycu.dev
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (vercel build → .vercel/output)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Deployment | $URL |"
            echo "| Production | https://shelfware.edycu.dev |"
            echo "| Alias | https://shelfware-cmc.vercel.app |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Version | \`${{ needs.release.outputs.version || 'unchanged' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
