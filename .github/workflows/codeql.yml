name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '41 4 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # python: the engine, scripts and tests. javascript-typescript: the three Vercel
        # functions in api/ and the page script in scripts/site_templates/app.js.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: '${{ matrix.language }}' }
      - uses: github/codeql-action/analyze@v4
        with: { category: '/language:${{ matrix.language }}' }
