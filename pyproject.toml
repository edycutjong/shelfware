[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfware"
version = "1.0.1"
description = "Which tokenised stocks on CoinMarketCap actually have a market — a census of the wrappers left on the shelf."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Edy Cu" }]
dependencies = []

[project.scripts]
shelfware = "shelfware.cli:main"

[tool.setuptools]
packages = ["shelfware"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the CLI and the scripts print sentences to a human; wrapping them to 100 columns hurts more
# than it helps. Library code (client, join, lookup, delta, verify) keeps the limit.
"shelfware/cli.py" = ["E501"]
"scripts/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^site/", "^data/", "^docs/", "^\\.venv/"]

[tool.coverage.run]
# shelfware/__main__.py is three lines that exist so `python3 -m shelfware` works; it only
# ever runs as a subprocess, where the tracer cannot see it.
omit = ["shelfware/__main__.py"]

[tool.coverage.report]
show_missing = true
