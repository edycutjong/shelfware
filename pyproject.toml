[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfware"
version = "0.1.0"
description = "Which tokenised stocks on CoinMarketCap actually have a market — a census of the wrappers left on the shelf."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Edy Cu" }]
dependencies = []

[project.scripts]
shelfware = "shelfware.cli:main"

[tool.setuptools]
packages = ["shelfware"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]
